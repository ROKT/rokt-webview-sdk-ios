version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
  - package-ecosystem: cocoapods
    directory: /Example
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependabot
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependabot
  # No swift/SPM entry — this repo has no Package.swift, only a podspec
  # (for publishing) and a real Podfile+Podfile.lock under Example/.
